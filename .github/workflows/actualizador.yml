name: Actualizacion Automatica Scraping

on:
  schedule:
    # Se ejecuta automáticamente todos los días a medianoche (UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite ejecutar el flujo manualmente con un botón

jobs:
  ejecutar-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Instalar librerias necesarias
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pandas

    - name: Ejecutar script de scraping
      run: python scraper.py

    - name: Guardar y subir cambios en el CSV
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add citas_famosas.csv
        git commit -m "Actualizacion automatica de citas_famosas.csv" || exit 0
        git push
